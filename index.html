<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Fish Attachment Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f7f8; --surface:#fff; --surface-2:#eaf1f3; --line:#d5e1e5; --fg:#11262d; --muted:#5a7179;
  --pool:#0b6e8a; --pool-ink:#fff; --pool-soft:#d6edf3; --lane:#e8b021;
  --ok:#1f8a4c; --ok-soft:#dcf2e4; --warn:#b86e00; --warn-soft:#fbecd2; --bad:#c23b3b; --bad-soft:#f8dddd; --info:#3b62c2; --info-soft:#e0e7fa;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif; --body:"Figtree",ui-sans-serif,system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0c1a1f; --surface:#122329; --surface-2:#183037; --line:#25404a; --fg:#e3eef1; --muted:#8fa8b0;
  --pool:#3fb3d3; --pool-ink:#05212b; --pool-soft:#123b48; --lane:#f0c24a;
  --ok:#5ccf8b; --ok-soft:#133525; --warn:#f0a646; --warn-soft:#3a2a10; --bad:#f07b7b; --bad-soft:#3f1a1a; --info:#86a5f5; --info-soft:#1c2647;
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--body);padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pool);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.mark{width:38px;height:38px;border-radius:50%;background:var(--pool);display:grid;place-items:center;flex:none}
.brand h1{font-size:24px}
.who{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;min-width:0;overflow:hidden}
.head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:10px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.count{font-family:var(--mono);font-size:11px;background:var(--bad-soft);color:var(--bad);padding:1px 6px;border-radius:999px;margin-left:4px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;padding:7px 12px;border-radius:8px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--pool)}
.btn.primary{background:var(--pool);color:var(--pool-ink);border-color:var(--pool)}
.btn.danger{color:var(--bad)}
.btn.solid-danger{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.panel{padding:4px 16px 18px}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 0}
.filters select,.filters input{padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--surface)}
.grow{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-bottom:1px solid var(--line)}
.stats div{background:var(--surface);padding:10px 16px}
.stats b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.stats span{font-size:12px;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--warn-soft);color:var(--warn);margin-top:8px;font-size:13px}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert .btn{color:var(--fg)}.alert .btn.primary{color:var(--pool-ink)}
.day-h{display:flex;align-items:baseline;gap:8px;padding:14px 0 6px;border-bottom:2px solid var(--fg)}
.day-h h3{font-size:16px}
.today{font-size:11px;font-weight:700;background:var(--lane);color:#1d1600;padding:1px 7px;border-radius:999px}
.sess{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.sess.cancelled .what,.sess.cancelled .time{opacity:.55}
.time{font-family:var(--mono);font-size:13px}.time small{display:block;color:var(--muted)}
.what h4{margin:0 0 2px;font-size:14.5px}
.meta{color:var(--muted);font-size:13px}
.clsl{list-style:none;margin:6px 0 0;padding:6px 10px;display:grid;gap:3px;font-size:12.5px;color:var(--muted);border-left:2px solid var(--line)}
.clsl li{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px}
.clsl .mono{font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
.dot{width:7px;height:7px;border-radius:50%}
.d-pending{background:var(--warn)}.d-confirmed,.d-present{background:var(--ok)}.d-declined,.d-absent{background:var(--bad)}.d-none{background:var(--muted)}
.note{margin-top:8px;font-size:12.5px;padding:6px 10px;border-radius:7px;background:var(--surface-2)}
.note.bad{background:var(--bad-soft);color:var(--bad)}.note.info{background:var(--info-soft);color:var(--info)}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.pill{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.p-scheduled{background:var(--pool-soft);color:var(--pool)}.p-cancelled{background:var(--bad-soft);color:var(--bad)}.p-completed{background:var(--ok-soft);color:var(--ok)}.p-clash{background:var(--bad);color:#fff}.p-progress{background:var(--pool-soft);color:var(--pool)}
@media (max-width:640px){.sess{grid-template-columns:64px minmax(0,1fr)}.side{grid-column:1/-1;align-items:flex-start}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right}
.bar{height:8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;flex:1;min-width:90px}
.bar i{display:block;height:100%;background:var(--pool)}
.prog{display:flex;align-items:center;gap:8px;min-width:150px}
.rname{display:flex;gap:8px;align-items:center;border:0;background:none;padding:0;text-align:left}
.rname small{display:block;color:var(--muted);font-size:12px}
.det>td{background:var(--bg);padding:6px 10px 12px}
.det td,.det th{font-size:12.5px;padding:6px 8px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.empty{padding:28px 0;color:var(--muted);text-align:center}
.logrow{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.logrow .t{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;margin-right:6px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr));gap:20px}
.box{border:1px solid var(--line);border-radius:10px;padding:14px}
.box h3{font-size:15px;margin-bottom:8px}
.linkbox{font-family:var(--mono);font-size:12px;background:var(--bg);border:1px solid var(--line);padding:4px 8px;border-radius:6px;word-break:break-all}
.login{max-width:400px;margin:10vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--fg);width:min(520px,calc(100vw - 32px));max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(5,20,26,.5)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 34px);margin:0}
.dlg header{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.dlg header h2{font-size:19px}.dlg header p{margin:4px 0 0;color:var(--muted);font-size:13px}
.dlg .body{padding:14px 18px;display:flex;flex-direction:column;gap:12px;overflow-y:auto}
.dlg footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:4px}
.f label,.f .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.f input:not([type=checkbox]):not([type=radio]),.f select,.f textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;min-width:0;height:38px}
.f textarea{height:auto;min-height:60px;resize:vertical}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
.checks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;max-height:260px;overflow-y:auto}
.checks label{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px;color:var(--fg);font-weight:500}
.checks label:first-child{border-top:0}
.checks label:has(input:checked){background:var(--pool-soft)}
.checks input{width:16px;height:16px;margin:0;accent-color:var(--pool)}
.checks .sub{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hint{font-size:12.5px;padding:7px 10px;border-radius:7px;background:var(--info-soft);color:var(--info)}
.err{color:var(--bad);font-size:13px;margin:0}
.att{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg label{padding:4px 10px;font-size:12.5px;cursor:pointer;position:relative}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){background:var(--pool-soft);color:var(--pool);font-weight:700}
.seg label:has(input[value=absent]:checked){background:var(--bad-soft);color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;transition:.25s;z-index:50;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
.spin{opacity:.6;pointer-events:none}
.invite{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:480px){.invite{grid-template-columns:1fr}}
.qr{background:#fff;padding:10px;border-radius:10px;width:200px;height:200px;margin:0 auto}
.qr img,.qr canvas{display:block}
.invite-acts{display:flex;flex-direction:column;gap:8px;align-items:stretch;min-width:0}
.invite-acts .btn{white-space:normal;justify-content:center;text-align:center}
.slots{display:flex;flex-direction:column;gap:6px}
.daychips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.daychip{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:13px}
.daychip span{font-size:11.5px;color:var(--muted)}
.daychip.on{border-color:var(--pool);background:var(--pool-soft)}
.daychip:disabled{opacity:.45;cursor:not-allowed}
.clist{display:flex;flex-direction:column;gap:10px;max-height:320px;overflow-y:auto;padding-right:4px}
.cblock{flex:none;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.chead{display:flex;gap:8px;align-items:center;padding:7px 10px;background:var(--surface-2);font-size:13px}
.chead .btn{margin-left:auto}
.crow{display:grid;grid-template-columns:18px 118px minmax(0,1fr) auto 38px;gap:10px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px}
.crow:has(input:checked){background:var(--pool-soft)}
.crow input{width:16px;height:16px;margin:0;accent-color:var(--pool)}
.ctime{font-size:12.5px;color:var(--muted)}
.csize{font-size:12.5px;color:var(--muted);text-align:right}
.cdate{font-size:12px;color:var(--muted);white-space:nowrap;text-align:right}
.crow.off{cursor:not-allowed;background:var(--surface-2)}
.crow.off .ctime,.crow.off .clevel,.crow.off .csize{opacity:.55}
.tagp{display:inline-block;font-size:10.5px;font-weight:700;color:var(--info);background:var(--info-soft);border-radius:4px;padding:0 5px;margin-left:4px}
@media (max-width:480px){.crow{grid-template-columns:18px minmax(0,1fr) auto}.ctime,.clevel,.cdate{grid-column:2}.cdate{text-align:left}.csize{grid-column:3;grid-row:1}}
details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.up-day{font-size:12px;font-weight:700;color:var(--muted);margin-top:4px}
.slot.off{opacity:.5;cursor:not-allowed}
.slot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.slot:hover,.slot.on{border-color:var(--pool);background:var(--pool-soft)}
.slot span{grid-column:1;font-size:12.5px;color:var(--muted)}
.slot em{grid-row:1/3;grid-column:2;align-self:center;font-style:normal;font-size:12.5px;font-weight:600;color:var(--pool)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 12c3-5 9-6 13-2l4-3v10l-4-3c-4 4-10 3-13-2z" fill="var(--pool-ink)"/></svg></div>
      <div><h1>Attachment Log</h1><div class="muted">Happy Fish trainee attachments</div></div>
    </div>
    <div class="who" id="who" hidden><span id="whoEmail"></span><button class="btn sm" id="btnRefresh">↻ Refresh</button><button class="btn sm" id="btnOut">Sign out</button></div>
  </header>

  <section class="login" id="login" hidden>
    <h2>Sign in</h2>
    <p class="muted" style="margin:0">Enter your email. We'll send you a sign-in link.</p>
    <form id="loginForm" class="f" style="gap:10px">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="email" placeholder="you@example.com">
      <button class="btn primary" type="submit">Send sign-in link by email</button>
      <button class="btn" type="button" id="btnTgLogin">Send link to my Telegram</button>
      <p class="muted" id="loginMsg" style="margin:0"></p>
    </form>
  </section>

  <section class="card" id="app" hidden>
    <div class="head">
      <div class="tabs" role="tablist">
        <button class="tab" data-tab="schedule">Schedule</button>
        <button class="tab" data-tab="reports">Reports</button>
        <button class="tab" data-tab="trainees">Trainees</button>
        <button class="tab" data-tab="coaches">Coaches &amp; leave</button>
        <button class="tab" data-tab="log">Activity</button>
        <button class="tab" data-tab="settings">Settings</button>
      </div>
      <button class="btn primary" id="btnNew">+ New session</button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="panel" id="panel"></div>
  </section>
</div>
<dialog id="dlg"><form method="dialog" class="dlg" id="dlgForm"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.HF_CONFIG;
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const todaySG = () => new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Singapore' }).format(new Date());
const asUTC = (d) => new Date(d + 'T00:00:00Z');
const addDays = (d, n) => { const x = asUTC(d); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const fmtDay = (d) => asUTC(d).toLocaleDateString('en-SG', { timeZone: 'UTC', weekday: 'short', day: 'numeric', month: 'short' });
const fmtDayLong = (d) => asUTC(d).toLocaleDateString('en-SG', { timeZone: 'UTC', weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
const fmtT = (t) => { let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return h + (m ? ':' + String(m).padStart(2, '0') : '') + ap; };
const toMin = (t) => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const hrs = (s) => Math.round((toMin(s.end_time) - toMin(s.start_time)) / 60 * 100) / 100;
const when = (s) => `${fmtDay(s.date)} · ${fmtT(s.start_time)}–${fmtT(s.end_time)}`;
const round2 = (n) => Math.round(n * 100) / 100;
const short = (b) => String(b).replace(/ \(.*\)/, '');
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 3200); }

const REASONS = ['Lightning / wet weather', 'Coach on MC or leave', 'Class cancelled (no students)', 'Pool closure or maintenance', 'Public holiday', 'Other'];
const LEAVE = ['MC', 'Annual leave', 'Emergency leave', 'Other leave'];
let D = { sessions: [], trainees: [], coaches: [], branches: [], leave: [], log: [], changes: [], admins: [], notif: [], classes: [], syncs: [] };
let me = null, tab = 'schedule', bot = null;
let fView = 'upcoming', fCoach = '', fTrainee = '', repBatch = '', repShow = 'all', repOpen = null;
try { tab = localStorage.getItem('hf-tab') || 'schedule'; } catch (e) {}

async function api(action, params = {}) {
  const { data: { session } } = await sb.auth.getSession();
  const r = await fetch(`${SUPABASE_URL}/functions/v1/api`, {
    method: 'POST',
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + session.access_token, apikey: SUPABASE_ANON_KEY },
    body: JSON.stringify({ action, ...params }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong. Try again.');
  return j;
}
const sentMsg = (r) => {
  if (r && r.held) return "Trainees haven't been notified yet, so no Telegram message was sent.";
  if (!r || r.sent === undefined) return '';
  const bits = [`Telegram sent to ${r.sent}`];
  if (r.skipped) bits.push(`${r.skipped} not on Telegram (call them)`);
  if (r.failed) bits.push(`${r.failed} failed`);
  return bits.join(', ') + '.';
};

async function load() {
  const since = addDays(todaySG(), -400);
  const q = await Promise.all([
    sb.from('sessions').select('*, coach:coaches(name), session_trainees(trainee_id,response,attendance,hours_credited)').gte('date', since).order('date').order('start_time'),
    sb.from('trainees').select('*').order('name'),
    sb.from('coaches').select('*').order('name'),
    sb.from('branches').select('*').eq('active', true).order('name'),
    sb.from('coach_leave').select('*, coach:coaches(name)').gte('date', addDays(todaySG(), -30)).order('date'),
    sb.from('audit_log').select('*').order('created_at', { ascending: false }).limit(300),
    sb.from('session_changes').select('*').order('changed_at'),
    sb.from('admins').select('*').order('email'),
    sb.from('notifications').select('session_id,trainee_id,kind,status,error,created_at').neq('status', 'sent').gte('created_at', addDays(todaySG(), -30)),
    sb.from('coach_classes').select('*').order('start_time'),

const hoursOf = (tid) => round2(D.sessions.filter((s) => s.status === 'completed').reduce((n, s) => n + s.session_trainees.filter((x) => x.trainee_id === tid).reduce((m, x) => m + Number(x.hours_credited), 0), 0));

const ago = (ts) => { if (!ts) return 'never'; const d = Math.round((Date.now() - new Date(ts)) / 864e5); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : `${d} days ago`; };
const syncLine = () => `Timetable from Digital Brain: synced ${ago(lastSynced())}${pendingSync() ? ' · <span class="warn">sync requested</span>' : ''}`;
// Why a class has no lesson on a date: its group hasn't started yet, or nobody has signed up (e.g. a new Introductory/Foundation group)
const dayMon = (d) => asUTC(d).toLocaleDateString('en-SG', { timeZone: 'UTC', weekday: 'short', day: 'numeric', month: 'short' });
function noLesson(c, date) {
  if (c.start_date && c.start_date > date) return `Starts ${dayMon(c.start_date)}`;
  if (/^0\s*\//.test(c.students || '')) return 'No sign-ups yet';
  return '';
}
// A coach's Digital Brain classes on one weekday, grouped into one slot per branch.
// Only classes with a lesson that date are grouped; the others are listed greyed out under their branch.
function slotsFor(coachId, date) {
  if (!coachId || !date) return [];
  const wd = asUTC(date).getUTCDay(), by = {}, off = {};
  D.classes.filter((c) => c.coach_id === coachId && c.weekday === wd).forEach((c) => {
    const why = noLesson(c, date);
    if (why) (off[c.branch] = off[c.branch] || []).push({ ...c, why });
    else (by[c.branch] = by[c.branch] || []).push(c);
  });
  // Split a branch's day into back-to-back blocks; a gap over 15 min (e.g. lunch) starts a new slot
  const out = [];
  Object.entries(by).forEach(([branch, cs]) => {
    cs.sort((a, b) => a.start_time.localeCompare(b.start_time));
    let cur = null;
    cs.forEach((c) => {
      if (cur && toMin(c.start_time) <= toMin(cur.end) + 15) {
        cur.classes.push(c); if (c.end_time.slice(0, 5) > cur.end) cur.end = c.end_time.slice(0, 5);
      } else {
        cur = { branch, start: c.start_time.slice(0, 5), end: c.end_time.slice(0, 5), classes: [c], off: [] }; out.push(cur);
      }
    });
  });
  // Put each branch's no-lesson classes under the block they fall in (or the nearest one before)
  Object.entries(off).forEach(([branch, cs]) => cs.forEach((c) => {
    const mine = out.filter((b) => b.branch === branch);
    const home = mine.filter((b) => b.start <= c.start_time.slice(0, 5)).pop() || mine[0];
    if (home) home.off.push(c);
    else out.push({ branch, start: c.start_time.slice(0, 5), end: c.end_time.slice(0, 5), classes: [], off: [c] });
  }));
  out.forEach((b) => b.off.sort((x, y) => x.start_time.localeCompare(y.start_time)));
  return out.sort((a, b) => a.start.localeCompare(b.start));
}
// "9am 2.5 Toddler Advance +, 9:30am 2.2 Toddler Beginner" -> one class per line; any other note stays as plain text
function classList(note) {

}

function chip(x, s) {
  const t = tr(x.trainee_id);
  let cls, label;
  if (s.status === 'completed') { cls = 'd-' + (x.attendance || 'none'); label = x.attendance === 'present' ? `Present · ${Number(x.hours_credited)}h` : x.attendance === 'absent' ? 'Absent' : '–'; }
  else if (s.status === 'cancelled') { cls = 'd-none'; label = 'Cancelled'; }
  else if (!s.notified_at) { cls = 'd-none'; label = 'Not notified yet'; }
  else { cls = 'd-' + x.response; label = { pending: 'No reply yet', confirmed: 'Confirmed', declined: "Can't attend" }[x.response]; }
  const f = D.notif.find((n) => n.session_id === s.id && n.trainee_id === x.trainee_id && n.status === 'failed');
  if (!t.telegram_chat_id && s.status === 'scheduled') label += ' · not on Telegram';
  else if (f && s.status === 'scheduled') label += ' · message failed';
  return `<span class="chip"><span class="dot ${cls}"></span><b style="font-weight:600">${esc(t.name)}</b><span class="muted">${label}</span></span>`;
}

/* ---------- reports ---------- */
function reportRows() {
  return D.trainees.filter((t) => !repBatch || t.batch === repBatch).map((t) => {
    const recs = D.sessions.filter((s) => s.status === 'completed').flatMap((s) => s.session_trainees.filter((x) => x.trainee_id === t.id && x.attendance).map((x) => ({ s, x })));
    let run = 0, doneOn = null;
    const req = Number(t.required_hours);
    recs.forEach((r) => { run += Number(r.x.hours_credited); r.cum = round2(run); if (!doneOn && run >= req) doneOn = r.s.date; });
    const done = round2(run);
    return { t, recs, done, req, complete: done >= req, doneOn, left: Math.max(0, round2(req - done)),
      att: recs.filter((r) => r.x.attendance === 'present').length, abs: recs.filter((r) => r.x.attendance === 'absent').length,
      last: [...recs].reverse().find((r) => r.x.attendance === 'present'), next: upcomingFor(t.id)[0] };
  }).filter((r) => repShow === 'all' || (repShow === 'done' ? r.complete : !r.complete));
}
const csvCell = (v) => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function reportCSV(kind) {

      ...rows.map((r) => [r.t.name, r.t.batch, r.done, r.req, r.left, r.att, r.abs, r.last ? r.last.s.date : '', r.complete ? 'Completed' : 'In progress', r.doneOn || ''])]
    : [['Trainee', 'Batch', 'Date', 'Senior coach', 'Branch', 'From', 'To', 'Attendance', 'Hours credited', 'Running total'],
      ...rows.flatMap((r) => r.recs.map((z) => [r.t.name, r.t.batch, z.s.date, z.s.coach.name, z.s.branch, z.s.start_time.slice(0, 5), z.s.end_time.slice(0, 5), z.x.attendance === 'present' ? 'Present' : 'Absent', Number(z.x.hours_credited), z.cum]))];
  return out.map((r) => r.map(csvCell).join(',')).join('\n');
}

    <div>${s.session_trainees.map((x) => { const t = tr(x.trainee_id); return `<div class="att"><span><b>${esc(t.name)}</b> <span class="muted mono" style="font-size:12px">${hoursOf(t.id)}/${Number(t.required_hours)}h</span></span><span class="seg"><label><input type="radio" name="a-${t.id}" value="present" checked>Present</label><label><input type="radio" name="a-${t.id}" value="absent">Absent</label></span></div>`; }).join('')}</div>
    <div class="f"><label for="a-remark">Coach remark (sent to trainees, optional)</label><textarea id="a-remark" name="remark"></textarea></div>${errP}</div>${foot('Save &amp; notify')}`, async (fd) => {
    const attendance = {}; s.session_trainees.forEach((x) => { attendance[x.trainee_id] = fd.get('a-' + x.trainee_id); });
    await api('logAttendance', { id: s.id, attendance, remark: fd.get('remark') });
    return 'Attendance saved. Hours updated.';
  });
}
function dlgTrainee(t) {
  open(`<header><h2>${t ? 'Edit trainee' : 'Add trainee'}</h2></header><div class="body">
    <div class="f"><label for="t-name">Full name</label><input id="t-name" name="name" required value="${esc(t?.name || '')}"></div>
    <div class="row2"><div class="f"><label for="t-batch">Batch</label><input id="t-batch" name="batch" placeholder="e.g. Batch 45" value="${esc(t?.batch || '')}"></div>
      <div class="f"><label for="t-phone">Phone (optional)</label><input id="t-phone" name="phone" value="${esc(t?.phone || '')}"></div></div>
    <div class="row2"><div class="f"><label for="t-req">Required hours</label><input id="t-req" name="required_hours" type="number" min="1" step="0.5" value="${t ? Number(t.required_hours) : 24}"></div>
      ${t ? `<div class="f"><label for="t-active">Status</label><select id="t-active" name="active"><option value="1">Active</option><option value="0" ${t.active ? '' : 'selected'}>Inactive</option></select></div>` : ''}</div>
    ${errP}</div>${foot(t ? 'Save' : 'Add trainee')}`, async (fd) => {
    const row = { name: fd.get('name').trim(), batch: fd.get('batch').trim() || null, phone: fd.get('phone').trim() || null, required_hours: Number(fd.get('required_hours')) || 24 };
    if (t) row.active = fd.get('active') === '1';
    const { data: saved, error } = t ? await sb.from('trainees').update(row).eq('id', t.id).select().single() : await sb.from('trainees').insert(row).select().single();
    if (error) throw new Error(error.message);
    if (!t && saved) afterSave = () => dlgInvite(saved);
    return t ? 'Saved.' : `${row.name} added.`;
  });
}
// Telegram only lets a bot message someone after they tap Start, so make that one tap as easy as possible
const waNumber = (p) => { const d = String(p || '').replace(/\D/g, ''); return !d ? '' : d.length === 8 ? '65' + d : d; };
function dlgInvite(t) {
  if (!bot?.username) { toast('Connect the bot in Settings first.'); return; }
  const link = linkFor(t);
  const msg = `Hi ${t.name.split(' ')[0]}, please tap this link and press Start to get your Happy Fish attachment schedule and alerts on Telegram:\n${link}`;
  const wa = waNumber(t.phone);
  open(`<header><h2>Invite ${esc(t.name)} to Telegram</h2><p>Telegram needs them to tap Start once. After that, all their attachment messages arrive automatically.</p></header>
  <div class="body">
    <div class="invite">
      <div><div id="qr" class="qr"></div><p class="muted" style="font-size:12.5px;margin:6px 0 0;text-align:center">With you in person? They scan this with their phone camera.</p></div>
      <div class="invite-acts">
        ${wa ? `<a class="btn primary" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(msg)}">Send invite on WhatsApp</a>` : `<p class="muted" style="margin:0;font-size:13px">Add their phone number (Edit) to send it on WhatsApp in one click.</p>`}
        <button type="button" class="btn" id="inv-copy">Copy invite message</button>
        <span class="linkbox">${esc(link)}</span>
        <p id="inv-status" class="${t.telegram_chat_id ? 'ok' : 'muted'}" style="margin:4px 0 0">${t.telegram_chat_id ? '● Already linked' : '⏳ Waiting for them to tap Start…'}</p>
      </div>
    </div>
  </div><footer><button class="btn" value="x" formnovalidate>Done</button></footer>`, async () => {});
  try { new QRCode($('#qr'), { text: link, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.M }); } catch (e) { $('#qr').innerHTML = '<p class="muted">QR unavailable</p>'; }
  $('#inv-copy').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(msg); toast('Invite copied.'); } catch (x) { prompt('Copy this invite:', msg); }
  });
  if (t.telegram_chat_id) return;
  const poll = setInterval(async () => {
    if (!dlg.open) return clearInterval(poll);
    const { data } = await sb.from('trainees').select('telegram_chat_id').eq('id', t.id).single();
    if (data?.telegram_chat_id) { clearInterval(poll); const s = $('#inv-status'); if (s) { s.className = 'ok'; s.textContent = `✅ ${t.name} is linked. They'll get their attachment messages on Telegram.`; } load(); }
  }, 3000);
}
function dlgCoach(c) {
  open(`<header><h2>${c ? 'Edit coach' : 'Add senior coach'}</h2></header><div class="body">
    <div class="f"><label for="c-name">Name (as in Digital Brain)</label><input id="c-name" name="name" required value="${esc(c?.name || '')}" placeholder="e.g. Phoebe - Lim Guan Keng"></div>
    ${c ? `<div class="f"><label for="c-active">Status</label><select id="c-active" name="active"><option value="1">Active</option><option value="0" ${c.active ? '' : 'selected'}>Inactive</option></select></div>` : ''}${errP}</div>${foot(c ? 'Save' : 'Add coach')}`, async (fd) => {
    const row = { name: fd.get('name').trim() }; if (c) row.active = fd.get('active') === '1';
    const { error } = c ? await sb.from('coaches').update(row).eq('id', c.id) : await sb.from('coaches').insert(row);
    if (error) throw new Error(error.message.includes('duplicate') ? 'That coach already exists.' : error.message);
    return 'Saved.';
  });
}
function dlgLeave() {
  open(`<header><h2>Add coach leave</h2><p>From a relief request. Attachments that day get flagged.</p></header><div class="body">
    <div class="row2"><div class="f"><label for="l-coach">Coach</label><select id="l-coach" name="coach_id">${opts(D.coaches.filter((c) => c.active), '', (c) => c.id, (c) => c.name)}</select></div>
      <div class="f"><label for="l-date">Date</label><input id="l-date" type="date" name="date" required min="${todaySG()}" value="${todaySG()}"></div></div>
    <div class="f"><label for="l-reason">Reason</label><select id="l-reason" name="reason">${opts(LEAVE)}</select></div>${errP}</div>${foot('Add leave')}`, async (fd) => {
    const r = await api('addLeave', { coach_id: fd.get('coach_id'), date: fd.get('date'), reason: fd.get('reason') });
    if (r.clashes) { tab = 'schedule'; return `Leave added. ${r.clashes} attachment session(s) clash. See the Schedule tab.`; }
    return 'Leave added. No attachments affected.';
  });
}

/* ---------- events ---------- */
document.addEventListener('click', async (e) => {
  const t = e.target.closest('button'); if (!t || t.closest('dialog')) return;
  if (t.classList.contains('tab')) { tab = t.dataset.tab; try { localStorage.setItem('hf-tab', tab); } catch (x) {} render(); return; }
  const s = t.dataset.id && D.sessions.find((x) => x.id === t.dataset.id);
  if (t.dataset.act) return ({ attend: dlgAttend, resched: dlgResched, cancel: dlgCancel, postpone: dlgPostpone, notify: dlgNotify })[t.dataset.act](s);
  if (t.dataset.add) return ({ trainee: () => dlgTrainee(), coach: () => dlgCoach(), leave: dlgLeave })[t.dataset.add]();
  if (t.dataset.edit === 'trainee') return dlgTrainee(D.trainees.find((x) => x.id === t.dataset.id));
  if (t.dataset.edit === 'coach') return dlgCoach(D.coaches.find((x) => x.id === t.dataset.id));
  if (t.dataset.rep) { repOpen = repOpen === t.dataset.rep ? null : t.dataset.rep; return render(); }
  if (t.dataset.csv) {
    const blob = new Blob(['﻿' + reportCSV(t.dataset.csv)], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `attachment-${t.dataset.csv}-${todaySG()}.csv`; a.click(); return;
  }
  if (t.dataset.invite) return dlgInvite(D.trainees.find((x) => x.id === t.dataset.invite));
  if (t.dataset.copy) {
    const tt = D.trainees.find((x) => x.id === t.dataset.copy);
    const txt = `Hi ${tt.name.split(' ')[0]}, please tap this link and press Start to get your Happy Fish attachment schedule and alerts on Telegram:\n${linkFor(tt)}`;
    try { await navigator.clipboard.writeText(txt); toast('Invite copied. Paste it into WhatsApp or Telegram.'); } catch (x) { prompt('Copy this invite:', txt); }
    return;
  }
  if (t.dataset.admininvite) {
    const a = D.admins.find((x) => x.email === t.dataset.admininvite);
    const txt = `Hi! Tap this link and press Start to connect your Telegram to the Happy Fish Attachment Log console:\nhttps://t.me/${bot.username}?start=A${a.link_code}\n\nThen open ${location.origin + location.pathname}, enter ${a.email} and press "Send link to my Telegram" to sign in.`;
    try { await navigator.clipboard.writeText(txt); toast('Invite copied. Send it to them on WhatsApp or Telegram.'); } catch (x) { prompt('Copy this invite:', txt); }
    return;
  }
  if (t.dataset.delleave) { if (!confirm('Remove this leave?')) return; try { await api('removeLeave', { id: t.dataset.delleave }); toast('Leave removed.'); await load(); } catch (x) { toast(x.message); } return; }
  if (t.dataset.deladmin) { if (!confirm(`Remove ${t.dataset.deladmin}?`)) return; await sb.from('admins').delete().eq('email', t.dataset.deladmin); return load(); }
  if (t.id === 'btnNew') return dlgNew();
  if (t.id === 'btnRefresh') { await load(); return toast('Up to date.'); }
  if (t.id === 'btnOut') { await sb.auth.signOut(); return location.reload(); }
  if (t.id === 'btnBotCheck') { bot = null; render(); return refreshBot(); }
  if (t.id === 'btnSync') return dlgSync();
  if (t.id === 'btnConnect') { t.disabled = true; try { bot = await api('connectBot'); toast('Bot connected.'); } catch (x) { toast(x.message); } render(); return; }
});
document.addEventListener('change', async (e) => {
  const id = e.target.id, v = e.target.value;
  if (id === 'notifySync' || id === 'notifyLeave') {
    const col = id === 'notifySync' ? 'notify_sync' : 'notify_leave';
    const { error } = await sb.from('admins').update({ [col]: e.target.checked }).eq('email', me);
    toast(error ? error.message : e.target.checked ? "Turned on. Alerts come to your linked Telegram." : 'Alerts turned off.');
    return load();
  }
  if (id === 'fView') fView = v; else if (id === 'fCoach') fCoach = v; else if (id === 'fTrainee') fTrainee = v;
  else if (id === 'rBatch') repBatch = v; else if (id === 'rShow') repShow = v; else return;
  render();
});
document.addEventListener('submit', async (e) => {
  if (e.target.id === 'adminForm') {
    e.preventDefault();
    const { error } = await sb.from('admins').insert({ email: $('#adminEmail').value.trim().toLowerCase() });
    if (error) return toast(error.message);
    toast('Added. They can now sign in with that email.'); load();
  }
});
$('#btnTgLogin').addEventListener('click', async () => {
  const email = $('#email').value.trim();
  if (!email) { $('#loginMsg').textContent = 'Enter your email first.'; return; }
  try {
    const r = await fetch(`${SUPABASE_URL}/functions/v1/api`, { method: 'POST', headers: { 'content-type': 'application/json', apikey: SUPABASE_ANON_KEY }, body: JSON.stringify({ action: 'telegramLogin', email }) });
    const j = await r.json();
    $('#loginMsg').textContent = (j.message || 'Sent.') + ' Not linked yet? Ask an admin for your Telegram invite (Settings).';
  } catch (x) { $('#loginMsg').textContent = 'Could not send. Try again.'; }
});
$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const { error } = await sb.auth.signInWithOtp({ email: $('#email').value.trim(), options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } });
  $('#loginMsg').textContent = error ? error.message : 'Check your email and tap the sign-in link.';
});

/* ---------- start ---------- */
let started = false;
async function start() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { $('#login').hidden = false; return; }
  if (started) return; started = true;
  me = session.user.email.toLowerCase();
  const { data: ok } = await sb.rpc('is_admin');
  if (!ok) { started = false; $('#login').hidden = false; $('#loginMsg').textContent = `${me} isn't allowed to use this console. Ask an admin to add you.`; await sb.auth.signOut(); return; }
  $('#who').hidden = false; $('#whoEmail').textContent = me; $('#app').hidden = false; $('#login').hidden = true;
  await load(); refreshBot();
  setInterval(() => { if (!dlg.open && document.visibilityState === 'visible') load().catch(() => {}); }, 60000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !dlg.open) load().catch(() => {}); });
}
sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_IN') start(); });
start().catch((e) => toast(e.message));
})();
</script>
</body>
</html>
